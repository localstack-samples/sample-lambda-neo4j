name: Deploy on LocalStack

on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # “At 00:00 on Sunday.”
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sam:
    name: Setup infrastructure using SAM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install lstk
        run: |
          npm install -g @localstack/lstk
          lstk setup aws --force --non-interactive

      # Docker Compose puts LocalStack, the Lambda containers and Neo4j on one network,
      # so the function reaches the database at bolt://neo4j:7687
      - name: Start LocalStack and Neo4j
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: make start

      - name: Build and deploy the SAM app
        run: make deploy

      - name: Run tests
        run: make test

      - name: Show logs
        if: failure()
        run: |
          docker compose logs --tail 300 localstack || true
          docker compose logs --tail 100 neo4j || true
